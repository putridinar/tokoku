<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login Pengguna</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm p-4">
        <h3 class="text-center mb-4">Login untuk Belanja</h3>

        <form id="loginForm">
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" id="email" class="form-control" required>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" class="form-control" required>
          </div>

          <div id="loginStatus" class="mb-3 text-center"></div>

          <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
		
			<div class="text-center mt-3">
			  <button id="googleLoginBtn" class="btn btn-outline-danger w-100">
				<i class="bi bi-google"></i> Login dengan Google
			  </button>
			</div>

        <div class="mt-3 text-center">
          <span>Belum punya akun? <a type="button" class="btn-link btn-sm" data-bs-toggle="modal" data-bs-target="#registerModal">Daftar di sini</a></span>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyDN2dgu-Sdsc9K5fermxPFwDUiCzX71ce8",
    authDomain: "tokoputridinar.firebaseapp.com",
    projectId: "tokoputridinar",
    storageBucket: "tokoputridinar.firebasestorage.app",
    messagingSenderId: "747234240117",
    appId: "1:747234240117:web:a87af4f6724ab87ad23a3c",
    measurementId: "G-M2JGJH3NVQ"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// 🔥 Login Email & Password
const form = document.getElementById('loginForm');
const status = document.getElementById('loginStatus');

form.addEventListener('submit', async (e) => {
  e.preventDefault();

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  status.innerHTML = "🔄 Proses login...";

  try {
    await signInWithEmailAndPassword(auth, email, password);
    status.innerHTML = `<div class="text-success">✅ Login berhasil!</div>`;
    setTimeout(() => {
      window.location.href = "/";
    }, 1000);
  } catch (error) {
    console.error(error);
    status.innerHTML = `<div class="text-danger">❌ Login gagal: ${error.message}</div>`;
  }
});

// 🔥 Login Dengan Google
const googleLoginBtn = document.getElementById('googleLoginBtn');

googleLoginBtn.addEventListener('click', async () => {
  const provider = new GoogleAuthProvider();

  try {
    await signInWithPopup(auth, provider);
    status.innerHTML = `<div class="text-success">✅ Login Google berhasil!</div>`;
    setTimeout(() => {
      window.location.href = "/";
    }, 1000);
  } catch (error) {
    console.error(error);
    status.innerHTML = `<div class="text-danger">❌ Login Google gagal: ${error.message}</div>`;
  }
});
</script>

<!-- Modal Pendaftaran -->
<div class="modal fade" id="registerModal" tabindex="-1" aria-labelledby="registerModalLabel" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <form id="registerForm">
        <div class="modal-header">
          <h5 class="modal-title" id="registerModalLabel">Daftar Akun Baru</h5>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label for="regEmail" class="form-label">Email</label>
            <input type="email" id="regEmail" class="form-control" required>
          </div>

          <div class="mb-3">
            <label for="regPassword" class="form-label">Password</label>
            <input type="password" id="regPassword" class="form-control" required minlength="6">
          </div>

          <div id="registerStatus" class="text-center mb-2"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
          <button type="submit" class="btn btn-primary">Daftar</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Firebase + Script Registrasi -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, sendEmailVerification } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyDN2dgu-Sdsc9K5fermxPFwDUiCzX71ce8",
    authDomain: "tokoputridinar.firebaseapp.com",
    projectId: "tokoputridinar",
    storageBucket: "tokoputridinar.firebasestorage.app",
    messagingSenderId: "747234240117",
    appId: "1:747234240117:web:a87af4f6724ab87ad23a3c",
    measurementId: "G-M2JGJH3NVQ"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// Script Form Pendaftaran
const registerForm = document.getElementById('registerForm');
const registerStatus = document.getElementById('registerStatus');

registerForm.addEventListener('submit', async (e) => {
  e.preventDefault();

  const email = document.getElementById('regEmail').value.trim();
  const password = document.getElementById('regPassword').value;

  registerStatus.innerHTML = "🔄 Membuat akun...";

  try {
    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
    const user = userCredential.user;

    // 🔥 Kirim email verifikasi
    await sendEmailVerification(user);

    registerStatus.innerHTML = `<div class="text-success">
      ✅ Akun berhasil dibuat!<br>
      🔥 Silakan cek email <strong>${email}</strong> untuk verifikasi akun.
    </div>`;

    // 🔥 Optional: Logout user sementara
    setTimeout(() => {
      window.location.href = "/userLogin"; // arahkan ke login page
    }, 3000);

  } catch (error) {
    console.error(error);
    registerStatus.innerHTML = `<div class="text-danger">❌ Gagal daftar: ${error.message}</div>`;
  }
});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
