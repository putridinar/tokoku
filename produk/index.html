---
layout: default
permalink: /produk
---

    <div class="container">
      <main class="product-grid">
        {% for product in site.products %}
          <section class="entry card-box styles" itemscope itemtype="http://schema.org/Product">

        		<div class="style">
        			<a href="{{ product.url }}">
        				<img class="card-img-top" src="{{ product.featured_image_path }}" itemprop="image">
        			</a>
        		</div>

            <div class="card-body product-details text-center">
              <div class="product-name">
			          <h4><a href="{{ product.url }}">{{ product.title }}</a></h4>
              </div>
              <div class="product-price">
							  <p>Rp. {{ product.price }}</p>
              </div>
						</div>

          </section>
        {% endfor %}
      </main>
   </div>
